[package]
name = "lazywt"
version = "1.0.0"
edition = "2021"
description = "Git worktree manager for bare repositories"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
owo-colors = { version = "4", features = ["supports-colors"] }
is-terminal = "0.4"
thiserror = "2"
anyhow = "1"
dialoguer = { version = "0.12", default-features = false }
dunce = "1"
glob = "0.3"
dirs = "6"
semver = "1"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "mock_gh"
path = "tests/bins/mock_gh.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
