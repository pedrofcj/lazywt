name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --summary-only --ignore-filename-regex "(config.interactive|prompt\.rs|navigate\.rs|config_cmd\.rs)" 2>&1 | tee coverage-summary.txt
          echo "---"
          cat coverage-summary.txt

      - name: Check coverage threshold
        run: |
          TOTAL_LINE=$(grep "^TOTAL" coverage-summary.txt | awk '{for(i=1;i<=NF;i++) if($i ~ /%/) last=$i} END{print last}')
          COV_PCT=$(echo "$TOTAL_LINE" | sed 's/%//')
          echo "Overall line coverage: ${COV_PCT}%"
          if (( $(echo "$COV_PCT < 90.0" | bc -l) )); then
            echo "::error::Coverage ${COV_PCT}% is below the 90% threshold"
            exit 1
          fi
          echo "Coverage ${COV_PCT}% meets the 90% threshold"
